spring.application.name=task-service
server.port=${SERVER_PORT:8001}
spring.datasource.url=${TASK_DB_URL:jdbc:postgresql://localhost:5433/task_db?currentSchema=task_service}
spring.datasource.username=${TASK_DB_USERNAME:task_app}
spring.datasource.password=${TASK_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.validation-timeout=1000
spring.flyway.default-schema=task_service
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never
task.identity-base-url=${IDENTITY_BASE_URL:http://localhost:8000}
management.endpoints.web.exposure.include=prometheus
logging.structured.format.console=ecs
task.identity-service-key=${TASK_IDENTITY_SERVICE_KEY:}
task.cursor-secret=${TASK_CURSOR_SECRET:}
task.outbox.enabled=${TASK_OUTBOX_ENABLED:false}
task.broker.host=${TASK_BROKER_HOST:localhost}
task.broker.port=${TASK_BROKER_PORT:5672}
task.broker.vhost=${TASK_BROKER_VHOST:taskmgn}
task.broker.username=${TASK_BROKER_USERNAME:task}
task.broker.password=${TASK_BROKER_PASSWORD:}
task.broker.tls=${TASK_BROKER_TLS:false}
