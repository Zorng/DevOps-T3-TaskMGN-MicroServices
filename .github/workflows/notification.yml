name: Notification service

on:
  pull_request:
    paths:
      - 'services/notification/**'
      - 'api_contracts/**'
      - '.github/workflows/notification.yml'
  push:
    branches: [main]
    paths:
      - 'services/notification/**'
      - 'api_contracts/**'
      - '.github/workflows/notification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/notification
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: notification
          POSTGRES_USER: notification_app
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U notification_app -d notification"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://notification_app:ci-only@127.0.0.1:5432/notification
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/notification/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run migrate
      - run: npm run migrate
      - run: npm run test:unit
      - run: npm run test:request
      - run: npm run test:integration

  container:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t notification:ci services/notification
      - name: Verify the container answers liveness
        run: |
          docker run -d --name notification-ci -p 127.0.0.1:8002:8002 notification:ci
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 \
            -o /tmp/notification-health.json http://127.0.0.1:8002/health/live
          jq -e '. == {status: "ok"}' /tmp/notification-health.json
      - if: failure()
        run: docker logs notification-ci || true
      - if: always()
        run: docker rm -f notification-ci || true
