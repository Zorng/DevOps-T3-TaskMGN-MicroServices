# Sample telemetry under the real service names, so the same configuration loads unchanged.
# Use only to validate the configuration, never as evidence of the live system.
x-sample: &sample
  image: python:3.13-alpine
  command: ["python", "-u", "/sample/telemetry.py"]
  volumes:
    - ./sample/telemetry.py:/sample/telemetry.py:ro
  labels:
    taskmgn.logs: "true"
    taskmgn.stack: sample
  networks: [telemetry]

x-trace: &trace
  TRACE_REQUEST_ID: ${TRACE_REQUEST_ID:-6b3f2c1e-8a4d-4f5b-9c7e-1d2a3b4c5d6e}
  TRACE_EVENT_ID: ${TRACE_EVENT_ID:-9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b}

services:
  gateway:
    <<: *sample
    environment: { <<: *trace, SERVICE: gateway }
  identity-workspace:
    <<: *sample
    environment: { <<: *trace, SERVICE: identity-workspace, PORT: "8000" }
  identity-outbox:
    <<: *sample
    environment: { <<: *trace, SERVICE: identity-outbox, PORT: "8001" }
  task:
    <<: *sample
    environment: { <<: *trace, SERVICE: task, PORT: "8001", METRICS_PATH: /actuator/prometheus }
  notification:
    <<: *sample
    environment: { <<: *trace, SERVICE: notification, PORT: "8002" }
  broker:
    <<: *sample
    environment: { <<: *trace, SERVICE: broker, PORT: "15692" }
