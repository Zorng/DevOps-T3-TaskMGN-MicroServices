# Broker settings. Queues, exchanges and bindings are applied by
# scripts/provision.py (from definitions.json), and users are created there too
# from environment secrets, so nothing secret lives in Git. Note: do not use
# `load_definitions` here. With it, RabbitMQ skips creating the default admin
# user and nobody could log in.

# Management API (used by operators and by provision.py); private network only.
management.tcp.port = 15672

# Prometheus metrics, including per-queue depth (queue names are low-cardinality here).
prometheus.tcp.port = 15692
prometheus.return_per_object_metrics = true
